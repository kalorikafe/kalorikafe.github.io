<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2C221E" />
    <meta name="color-scheme" content="light dark" />
    <title>Kalori Cafe | Tüm Zincir Kafelerin Makro & Alerjen Haritası</title>
    <meta name="description" content="Starbucks, Kahve Dünyası, Espressolab, Gloria Jean's ve tüm zincir kafelerin içecek ve yiyecek kalori, protein, kafein ve alerjen değerlerini keşfedin." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:title" content="Kalori Cafe | Kafe Makro ve Alerjen Rehberi" />
    <meta property="og:description" content="10 zincirdeki 199 ürünü kalori, makro, kafein ve alerjen bilgileriyle karşılaştırın." />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('kalori_cafe_theme');
          var dark =
            saved === 'dark'
              ? true
              : saved === 'light'
                ? false
                : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage unavailable — system preference applies later */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
