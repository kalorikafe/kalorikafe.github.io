name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Catalog audit
        run: npm run catalog:audit

      - name: Image integrity and provenance audit
        run: npm run images:audit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build production artifact
        run: npm run build

      - name: Verify production artifact
        run: npm run verify:build

      - name: Enforce bundle budgets
        run: npm run budget:check

      - name: Production-preview Chromium E2E
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev
